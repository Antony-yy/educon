<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDUCON | Área do aluno</title>
  </head>
  <body>
    <main class="aluno-page">
      <section class="aluno-card" aria-labelledby="titulo-aluno">
        <p class="eyebrow">Portal acadêmico</p>
        <h1 id="titulo-aluno">Olá, <span id="nome-aluno"></span></h1>
        <p id="dados-aluno"></p>
        <form id="form-senha" class="form-modal" novalidate>
          <h2>Alterar senha</h2>
          <div class="field"><label class="field_label" for="senha-atual">Senha atual</label><input class="field_input" id="senha-atual" type="password" required /></div>
          <div class="field"><label class="field_label" for="nova-senha">Nova senha</label><input class="field_input" id="nova-senha" type="password" minlength="4" required /></div>
          <p class="form-message" id="mensagem-senha" role="alert"></p>
          <button class="btn btn--primary" type="submit">Salvar nova senha</button>
        </form>
        <button id="btn-logout" class="btn btn--ghost" type="button">Sair</button>
      </section>
    </main>
    <script type="module" src="/src/js/aluno.js"></script>
  </body>
</html>
